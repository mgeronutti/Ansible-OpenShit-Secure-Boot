[defaults]
# Inventário usado em execuções LOCAIS (linha de comando).
# No Ansible Automation Platform o inventário é o selecionado no Job Template
# e esta linha é ignorada.
inventory = ./inventories/development/hosts.yml
roles_path = ./roles
# Execução local: collections instaladas em ./collections
# (ansible-galaxy collection install -r collections/requirements.yml).
# No AAP as collections vêm do Execution Environment / sincronização do Projeto.
collections_path = ./collections:/usr/share/ansible/collections
# Log em arquivo desativado: no AAP a saída de cada Job já fica armazenada
# (e o diretório do projeto dentro do Execution Environment é descartado).
# Para registrar execuções locais, descomente:
# log_path = ./logs/ansible.log
# Evita criar arquivos de retry após falhas
retry_files_enabled = False
host_key_checking = True
interpreter_python = auto_silent
deprecation_warnings = True
# Saída mais legível (tarefas + resultados em YAML)
stdout_callback = ansible.builtin.default
result_format = yaml

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
