---
# Todo o trabalho é feito por chamadas à API do OpenShift, portanto o
# playbook roda na própria máquina do Ansible (localhost). Não é necessário
# acesso SSH às VMs nem aos nós do cluster.
all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    openshift:
      hosts: {}
